<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>FlowBoard - Start Planning</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="supabase-auth.js"></script>
    <script src="supabase-ui.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #fbf9f9;
        }

        .canvas-grid {
            background-image: radial-gradient(#e2bfb0 0.5px, transparent 0.5px);
            background-size: 24px 24px;
        }
    </style>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed": "#d0e4ff",
                        "error-container": "#ffdad6",
                        "on-surface-variant": "#5a4136",
                        "inverse-surface": "#303031",
                        "on-primary-container": "#572000",
                        "outline-variant": "#e2bfb0",
                        "surface": "#fbf9f9",
                        "on-error": "#ffffff",
                        "on-primary": "#ffffff",
                        "on-secondary-container": "#656464",
                        "on-primary-fixed": "#351000",
                        "primary-fixed-dim": "#ffb693",
                        "secondary-container": "#e5e2e1",
                        "error": "#ba1a1a",
                        "on-background": "#1b1c1c",
                        "surface-bright": "#fbf9f9",
                        "on-tertiary-fixed": "#001d35",
                        "tertiary-container": "#059eff",
                        "outline": "#8e7164",
                        "on-tertiary-fixed-variant": "#00497b",
                        "tertiary-fixed-dim": "#9ccaff",
                        "inverse-primary": "#ffb693",
                        "surface-variant": "#e3e2e2",
                        "surface-container-low": "#f5f3f3",
                        "on-tertiary-container": "#003357",
                        "on-secondary": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "surface-container": "#efeded",
                        "on-secondary-fixed": "#1c1b1b",
                        "primary": "#a04100",
                        "secondary": "#5f5e5e",
                        "primary-fixed": "#ffdbcc",
                        "tertiary": "#0062a1",
                        "surface-container-high": "#e9e8e7",
                        "on-secondary-fixed-variant": "#474646",
                        "on-error-container": "#93000a",
                        "on-primary-fixed-variant": "#7a3000",
                        "primary-container": "#ff6b00",
                        "surface-dim": "#dbdad9",
                        "secondary-fixed": "#e5e2e1",
                        "inverse-on-surface": "#f2f0f0",
                        "surface-tint": "#a04100",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-highest": "#e3e2e2",
                        "secondary-fixed-dim": "#c8c6c5",
                        "on-surface": "#1b1c1c",
                        "background": "#fbf9f9"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "grid-margin": "16px",
                        "sm": "12px",
                        "md": "16px",
                        "lg": "24px",
                        "grid-gutter": "12px",
                        "xs": "8px",
                        "base": "4px",
                        "xl": "32px"
                    },
                    "fontFamily": {
                        "display-lg": ["Inter"],
                        "display-lg-mobile": ["Inter"],
                        "body-sm": ["Inter"],
                        "headline-md": ["Inter"],
                        "label-caps": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "display-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                },
            },
        }
    </script>
</head>

<body
    class="bg-background text-on-surface min-h-screen flex flex-col items-center justify-center canvas-grid overflow-x-hidden p-4">
    
    <!-- Top Supabase Connection Badge -->
    <div class="fixed top-4 right-4 z-20">
        <div id="supabase-status-badge"></div>
    </div>

    <!-- Main Signup Canvas -->
    <main class="w-full max-w-md py-6 z-10">
        <!-- Brand Intro Section -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-10 h-10 rounded-xl bg-primary-container text-white shadow-md mb-2">
                <span class="material-symbols-outlined text-[24px]">space_dashboard</span>
            </div>
            <h2 class="text-2xl font-bold text-on-background tracking-tight mb-1">Create Your Account</h2>
            <p class="font-body-sm text-body-sm text-secondary">Join FlowBoard and manage your visual workspaces.</p>
        </div>

        <!-- Signup Card -->
        <div class="bg-surface-container-lowest border border-outline-variant/60 rounded-2xl p-6 sm:p-8 shadow-xl backdrop-blur-sm">
            <!-- Alert Notification Container -->
            <div id="auth-alert" class="hidden mb-4 p-3 rounded-lg text-xs leading-relaxed transition-all"></div>

            <form id="signup-form" class="space-y-4">
                <!-- Name Field -->
                <div class="group">
                    <label class="font-label-caps text-[11px] font-bold uppercase tracking-wider text-on-surface-variant mb-1 block"
                        for="name">Full Name</label>
                    <input
                        class="w-full bg-surface-container-low border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all py-2.5 px-3.5 font-body-lg text-body-lg placeholder-secondary/40 text-on-surface"
                        id="name" placeholder="Alex Morgan" required type="text" autocomplete="name">
                </div>

                <!-- Email Field -->
                <div class="group">
                    <label class="font-label-caps text-[11px] font-bold uppercase tracking-wider text-on-surface-variant mb-1 block"
                        for="email">Email Address</label>
                    <input
                        class="w-full bg-surface-container-low border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all py-2.5 px-3.5 font-body-lg text-body-lg placeholder-secondary/40 text-on-surface"
                        id="email" placeholder="alex@company.com" required type="email" autocomplete="email">
                </div>

                <!-- Password Field -->
                <div class="group">
                    <label class="font-label-caps text-[11px] font-bold uppercase tracking-wider text-on-surface-variant mb-1 block"
                        for="password">Password</label>
                    <div class="relative">
                        <input
                            class="w-full bg-surface-container-low border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all py-2.5 px-3.5 pr-10 font-body-lg text-body-lg placeholder-secondary/40 text-on-surface"
                            id="password" placeholder="At least 6 characters" minlength="6" required type="password" autocomplete="new-password">
                        <button
                            id="toggle-password-btn"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors flex items-center"
                            type="button" title="Toggle password visibility">
                            <span class="material-symbols-outlined text-[18px]">visibility</span>
                        </button>
                    </div>
                </div>

                <!-- Primary Action Button -->
                <button
                    id="signup-submit-btn"
                    class="w-full bg-primary-container text-white font-semibold py-3 rounded-lg shadow-md hover:opacity-95 active:scale-[0.98] transition-all duration-200 mt-4 flex items-center justify-center gap-2 text-sm"
                    type="submit">
                    <span id="signup-btn-text">Create FlowBoard Account</span>
                    <span id="signup-btn-spinner" class="hidden animate-spin material-symbols-outlined text-[18px]">progress_activity</span>
                </button>
            </form>

            <div class="flex items-center my-6">
                <div class="flex-grow h-px bg-outline-variant/60"></div>
                <span class="px-3 text-xs font-semibold text-secondary uppercase tracking-wider bg-surface-container-lowest">Or continue with</span>
                <div class="flex-grow h-px bg-outline-variant/60"></div>
            </div>

            <!-- Social Signups -->
            <div class="grid grid-cols-1 gap-3">
                <button
                    id="google-signup-btn"
                    type="button"
                    class="flex items-center justify-center gap-2.5 border border-outline-variant rounded-lg py-2.5 px-4 font-semibold text-xs text-on-surface hover:bg-surface-variant/50 active:scale-[0.98] transition-all bg-white shadow-sm">
                    <svg class="w-4 h-4" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                    Continue with Google
                </button>
            </div>
        </div>

        <!-- Footer Link -->
        <p class="mt-6 text-center font-body-sm text-body-sm text-on-surface-variant">
            Already have an account?
            <a class="text-primary font-bold hover:underline" href="login.html">Sign in here</a>
        </p>
    </main>

    <!-- Side Graphic (Decorative Bento Element for Desktop) -->
    <div class="hidden lg:block fixed right-0 top-0 bottom-0 w-1/3 bg-surface-container-high/60 border-l border-outline-variant/40 overflow-hidden backdrop-blur-sm">
        <div class="absolute inset-0 p-8 grid grid-cols-2 grid-rows-3 gap-4">
            <div class="bg-surface rounded-xl shadow-sm p-4 transform rotate-3 flex flex-col justify-between border border-outline-variant/30">
                <span class="material-symbols-outlined text-primary text-[28px]">palette</span>
                <div class="h-2 w-3/4 bg-primary/20 rounded-full"></div>
            </div>
            <div class="bg-surface rounded-xl shadow-sm p-4 transform -rotate-2 flex flex-col gap-2 border border-outline-variant/30">
                <div class="h-4 w-3/4 bg-primary-fixed rounded"></div>
                <div class="h-2 w-full bg-surface-variant rounded"></div>
                <div class="h-2 w-2/3 bg-surface-variant rounded"></div>
            </div>
            <div class="col-span-2 bg-surface rounded-xl shadow-sm overflow-hidden relative border border-outline-variant/30">
                <div class="absolute inset-0 bg-cover bg-center opacity-80"
                    style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuB7yN6Ap8zEtcOxxrD5eVPg1LezcvXXr1qDCsBEdv_8z2DFpxzf02dJvoEjQu_qqzHC0o9Pm7PksOqlLAXkvaNj-f0ss_UfH8PXHdSgA94UYPyJOQaLmxP1c9vKRdLTrgf8PXnXPGKFu630uUAhsXgkWkJ3tmtB29QNOsWj2GUDXnBgVNHZvKWTAq0Qji7BPpX3ThYEVq_tyo0UknkbKe3kAD7SOhxmz5tbwjBoVhp8lpNkkMWwKjKV09yCSVvaNRFhtaVZyFt8QKY')">
                </div>
            </div>
            <div class="bg-surface rounded-xl shadow-sm p-4 transform rotate-6 flex flex-col gap-2 border border-outline-variant/30">
                <div class="flex items-center gap-2">
                    <div class="w-3 h-3 rounded-full bg-emerald-500"></div>
                    <div class="h-2 w-12 bg-outline-variant rounded"></div>
                </div>
            </div>
            <div class="bg-primary-container rounded-xl shadow-md p-4 transform -rotate-6 flex flex-col justify-end text-white">
                <p class="font-bold text-xs uppercase tracking-wider">CANVAS WORKSPACE</p>
            </div>
        </div>
    </div>

    <!-- Background Atmospheric Shapes -->
    <div class="fixed -bottom-32 -left-32 w-96 h-96 bg-primary/5 rounded-full blur-3xl -z-10 pointer-events-none"></div>
    <div class="fixed top-1/4 -right-16 w-64 h-64 bg-tertiary/5 rounded-full blur-3xl -z-10 pointer-events-none"></div>

    <script>
        // Redirect if already authenticated
        if (window.FlowAuth) {
            window.FlowAuth.redirectIfLoggedIn();
        }

        // Toggle password visibility
        const togglePassBtn = document.getElementById('toggle-password-btn');
        if (togglePassBtn) {
            togglePassBtn.addEventListener('click', function () {
                const passInput = document.getElementById('password');
                const icon = this.querySelector('.material-symbols-outlined');
                if (passInput.type === 'password') {
                    passInput.type = 'text';
                    if (icon) icon.textContent = 'visibility_off';
                } else {
                    passInput.type = 'password';
                    if (icon) icon.textContent = 'visibility';
                }
            });
        }

        function showAlert(message, type = 'error') {
            const alertBox = document.getElementById('auth-alert');
            alertBox.className = type === 'error' 
                ? 'mb-4 p-3 rounded-lg text-xs leading-relaxed bg-red-50 text-red-700 border border-red-200 block' 
                : 'mb-4 p-3 rounded-lg text-xs leading-relaxed bg-emerald-50 text-emerald-800 border border-emerald-200 block';
            alertBox.textContent = message;
        }

        function hideAlert() {
            const alertBox = document.getElementById('auth-alert');
            alertBox.className = 'hidden';
        }

        // Google OAuth Sign Up
        document.getElementById('google-signup-btn').addEventListener('click', async () => {
            hideAlert();
            if (!window.FlowAuth.isConfigured()) {
                showAlert('Supabase is not configured yet. Click "Configure" at top right to connect your Supabase project.', 'error');
                FlowSupabaseUI.openConfigModal();
                return;
            }
            try {
                await window.FlowAuth.signInWithGoogle();
            } catch (err) {
                showAlert('Google Sign-Up failed: ' + (err.message || 'Please check Supabase settings.'));
            }
        });

        // Email / Password Form Submit
        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAlert();

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('signup-submit-btn');
            const btnText = document.getElementById('signup-btn-text');
            const btnSpinner = document.getElementById('signup-btn-spinner');

            if (!name || !email || !password) {
                showAlert('Please fill in all required fields.');
                return;
            }

            if (password.length < 6) {
                showAlert('Password must be at least 6 characters long.');
                return;
            }

            submitBtn.disabled = true;
            btnText.textContent = 'Creating account...';
            btnSpinner.classList.remove('hidden');

            try {
                if (window.FlowAuth.isConfigured()) {
                    const result = await window.FlowAuth.signUpWithEmail(email, password, name);
                    if (result.emailConfirmationRequired) {
                        showAlert('Account created! Supabase has sent a confirmation link to your email. Please verify your email, then log in.', 'success');
                        setTimeout(() => {
                            window.location.href = 'login.html';
                        }, 4000);
                    } else if (result.user) {
                        FlowSupabaseUI.showToast('Account created successfully! Welcome to FlowBoard.', 'success');
                        setTimeout(() => {
                            window.location.href = 'home.html';
                        }, 500);
                    }
                } else {
                    // Fallback to Express Local Signup or Prompt Configuration
                    const response = await fetch('/api/signup', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name, email, password })
                    });
                    const data = await response.json();
                    if (response.ok) {
                        FlowSupabaseUI.showToast('Account created! Please log in.', 'success');
                        setTimeout(() => {
                            window.location.href = 'login.html';
                        }, 600);
                    } else {
                        showAlert('Error: ' + (data.error || 'Failed to create account.'));
                    }
                }
            } catch (err) {
                console.error(err);
                showAlert('Registration error: ' + (err.message || 'Something went wrong.'));
            } finally {
                submitBtn.disabled = false;
                btnText.textContent = 'Create FlowBoard Account';
                btnSpinner.classList.add('hidden');
            }
        });
    </script>
</body>

</html>
