<!DOCTYPE html>

<html class="light" lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>FlowBoard - Welcome Back</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="supabase-auth.js"></script>
    <script src="supabase-ui.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet">
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed": "#d0e4ff",
                        "error-container": "#ffdad6",
                        "on-surface-variant": "#5a4136",
                        "inverse-surface": "#303031",
                        "on-primary-container": "#572000",
                        "outline-variant": "#e2bfb0",
                        "surface": "#fbf9f9",
                        "on-error": "#ffffff",
                        "on-primary": "#ffffff",
                        "on-secondary-container": "#656464",
                        "on-primary-fixed": "#351000",
                        "primary-fixed-dim": "#ffb693",
                        "secondary-container": "#e5e2e1",
                        "error": "#ba1a1a",
                        "on-background": "#1b1c1c",
                        "surface-bright": "#fbf9f9",
                        "on-tertiary-fixed": "#001d35",
                        "tertiary-container": "#059eff",
                        "outline": "#8e7164",
                        "on-tertiary-fixed-variant": "#00497b",
                        "tertiary-fixed-dim": "#9ccaff",
                        "inverse-primary": "#ffb693",
                        "surface-variant": "#e3e2e2",
                        "surface-container-low": "#f5f3f3",
                        "on-tertiary-container": "#003357",
                        "on-secondary": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "surface-container": "#efeded",
                        "on-secondary-fixed": "#1c1b1b",
                        "primary": "#a04100",
                        "secondary": "#5f5e5e",
                        "primary-fixed": "#ffdbcc",
                        "tertiary": "#0062a1",
                        "surface-container-high": "#e9e8e7",
                        "on-secondary-fixed-variant": "#474646",
                        "on-error-container": "#93000a",
                        "on-primary-fixed-variant": "#7a3000",
                        "primary-container": "#ff6b00",
                        "surface-dim": "#dbdad9",
                        "secondary-fixed": "#e5e2e1",
                        "inverse-on-surface": "#f2f0f0",
                        "surface-tint": "#a04100",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-highest": "#e3e2e2",
                        "secondary-fixed-dim": "#c8c6c5",
                        "on-surface": "#1b1c1c",
                        "background": "#fbf9f9"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "grid-margin": "16px",
                        "sm": "12px",
                        "md": "16px",
                        "lg": "24px",
                        "grid-gutter": "12px",
                        "xs": "8px",
                        "base": "4px",
                        "xl": "32px"
                    },
                    "fontFamily": {
                        "display-lg": ["Inter"],
                        "display-lg-mobile": ["Inter"],
                        "body-sm": ["Inter"],
                        "headline-md": ["Inter"],
                        "label-caps": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "display-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f5f5f5;
        }

        .canvas-dot-pattern {
            background-image: radial-gradient(#e0e0e0 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>

<body
    class="bg-surface text-on-surface min-h-screen flex flex-col items-center justify-center relative overflow-hidden p-4">
    <!-- Atmospheric Background Canvas Pattern -->
    <div class="absolute inset-0 canvas-dot-pattern opacity-50 pointer-events-none"></div>

    <!-- Top Supabase Connection Badge -->
    <div class="fixed top-4 right-4 z-20">
        <div id="supabase-status-badge"></div>
    </div>

    <!-- Login Container -->
    <main class="relative z-10 w-full max-w-md">
        <!-- Top Branding -->
        <div class="flex flex-col items-center justify-center mb-6 text-center">
            <div
                class="w-10 h-10 rounded-xl bg-primary-container text-white flex items-center justify-center shadow-md mb-2">
                <span class="material-symbols-outlined text-[24px]">space_dashboard</span>
            </div>
            <span
                class="font-display-lg-mobile text-display-lg-mobile text-primary tracking-tight font-extrabold">FlowBoard</span>
            <span class="text-xs font-medium text-secondary mt-0.5">Visual Spatial Canvas & Kanban Workspace</span>
        </div>

        <!-- Login Card -->
        <div
            class="bg-surface-container-lowest rounded-2xl p-6 sm:p-8 shadow-xl border border-outline-variant/60 backdrop-blur-sm">
            <header class="mb-6">
                <h1 class="text-2xl font-bold text-on-background tracking-tight mb-1">Welcome Back</h1>
                <p class="font-body-sm text-body-sm text-secondary">Sign in with Supabase to access your workspace.</p>
            </header>

            <!-- Alert Notification Container -->
            <div id="auth-alert" class="hidden mb-4 p-3 rounded-lg text-xs leading-relaxed transition-all"></div>

            <form id="login-form" class="space-y-4">
                <!-- Email Field -->
                <div class="group">
                    <label
                        class="font-label-caps text-[11px] font-bold uppercase tracking-wider text-on-surface-variant mb-1 block"
                        for="email">Email Address</label>
                    <div class="relative">
                        <input
                            class="w-full bg-surface-container-low border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all py-2.5 px-3.5 font-body-lg text-body-lg placeholder-secondary/40 text-on-surface"
                            id="email" name="email" placeholder="your@email.com" required="" type="email"
                            autocomplete="email">
                    </div>
                </div>

                <!-- Password Field -->
                <div class="group">
                    <div class="flex justify-between items-center mb-1">
                        <label
                            class="font-label-caps text-[11px] font-bold uppercase tracking-wider text-on-surface-variant block"
                            for="password">Password</label>
                        <button type="button" onclick="FlowSupabaseUI.openForgotPasswordModal()"
                            class="font-label-caps text-xs text-primary font-semibold hover:underline transition-colors">
                            Forgot Password?
                        </button>
                    </div>
                    <div class="relative">
                        <input
                            class="w-full bg-surface-container-low border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all py-2.5 px-3.5 pr-10 font-body-lg text-body-lg placeholder-secondary/40 text-on-surface"
                            id="password" name="password" placeholder="••••••••" required="" type="password"
                            autocomplete="current-password">
                        <button id="toggle-password-btn"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors flex items-center"
                            type="button" title="Toggle password visibility">
                            <span class="material-symbols-outlined text-[18px]">visibility</span>
                        </button>
                    </div>
                </div>

                <!-- Login Button -->
                <button id="login-submit-btn"
                    class="w-full bg-primary-container text-white font-semibold py-3 rounded-lg shadow-md hover:opacity-95 active:scale-[0.98] transition-all duration-200 mt-4 flex items-center justify-center gap-2 text-sm"
                    type="submit">
                    <span id="login-btn-text">Sign In</span>
                    <span id="login-btn-spinner"
                        class="hidden animate-spin material-symbols-outlined text-[18px]">progress_activity</span>
                </button>
            </form>

            <!-- Social Login Divider -->
            <div class="relative my-6 flex items-center">
                <div class="flex-grow border-t border-outline-variant/60"></div>
                <span
                    class="px-3 text-xs font-semibold text-secondary uppercase tracking-wider bg-surface-container-lowest">Or
                    continue with</span>
                <div class="flex-grow border-t border-outline-variant/60"></div>
            </div>

            <!-- Social Logins -->
            <div class="grid grid-cols-1 gap-3">
                <button id="google-login-btn" type="button"
                    class="flex items-center justify-center gap-2.5 border border-outline-variant rounded-lg py-2.5 px-4 font-semibold text-xs text-on-surface hover:bg-surface-variant/50 active:scale-[0.98] transition-all bg-white shadow-sm">
                    <svg class="w-4 h-4" viewBox="0 0 24 24">
                        <path fill="#4285F4"
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                        <path fill="#34A853"
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                        <path fill="#FBBC05"
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
                        <path fill="#EA4335"
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
                    </svg>
                    Continue with Google
                </button>
            </div>
        </div>

        <!-- Footer Link -->
        <div class="mt-6 text-center">
            <p class="font-body-sm text-body-sm text-on-surface-variant">
                Don't have an account?
                <a class="text-primary font-bold hover:underline transition-all" href="signup.html">Create one now</a>
            </p>
        </div>
    </main>

    <!-- Side Graphic for Visual Interest -->
    <div
        class="hidden lg:block absolute right-[-5%] top-1/2 -translate-y-1/2 w-[400px] h-[600px] pointer-events-none rotate-3 opacity-80">
        <div
            class="bg-surface-container-highest border border-outline-variant p-md rounded-xl w-64 h-48 absolute top-0 left-0 shadow-lg flex flex-col gap-base">
            <div
                class="w-full h-24 bg-surface-variant rounded-lg overflow-hidden flex items-center justify-center text-primary/40">
                <span class="material-symbols-outlined text-[48px]">view_kanban</span>
            </div>
            <div class="h-2 w-3/4 bg-primary-container/20 rounded-full"></div>
            <div class="h-2 w-1/2 bg-on-surface-variant/20 rounded-full"></div>
        </div>
        <div
            class="bg-surface-container-highest border border-outline-variant p-md rounded-xl w-56 h-40 absolute bottom-12 right-12 shadow-md -rotate-6 flex flex-col gap-base">
            <div class="flex gap-xs mb-xs">
                <div class="w-2 h-2 rounded-full bg-emerald-500"></div>
                <div class="w-2 h-2 rounded-full bg-primary"></div>
                <div class="w-2 h-2 rounded-full bg-tertiary"></div>
            </div>
            <div class="h-2 w-full bg-on-surface-variant/10 rounded-full"></div>
            <div class="h-2 w-5/6 bg-on-surface-variant/10 rounded-full"></div>
            <div class="h-2 w-2/3 bg-on-surface-variant/10 rounded-full"></div>
        </div>
    </div>

    <!-- Small Floating Accessory -->
    <div class="fixed bottom-4 left-4 hidden md:block z-10">
        <div
            class="bg-inverse-surface text-inverse-on-surface px-3.5 py-1.5 rounded-full flex items-center gap-2 shadow-lg text-xs font-medium opacity-90 hover:opacity-100 transition-opacity">
            <span class="material-symbols-outlined text-[16px] text-emerald-400">lock</span>
            <span>Supabase Auth & 256-bit Encryption</span>
        </div>
    </div>

    <script>
        // Check for OAuth error in URL if redirected back with error
        const urlParams = new URLSearchParams(window.location.search);
        const urlHash = new URLSearchParams(window.location.hash.substring(1));
        const errorDesc = urlParams.get('error_description') || urlHash.get('error_description') || urlParams.get('error');
        if (errorDesc) {
            showAlert('Google Sign-In notice: ' + decodeURIComponent(errorDesc.replace(/\+/g, ' ')));
        }

        // Redirect if already authenticated (only if no error in URL)
        if (window.FlowAuth && !errorDesc) {
            window.FlowAuth.redirectIfLoggedIn();
        }

        // Toggle password visibility
        const togglePassBtn = document.getElementById('toggle-password-btn');
        if (togglePassBtn) {
            togglePassBtn.addEventListener('click', function () {
                const passInput = document.getElementById('password');
                const icon = this.querySelector('.material-symbols-outlined');
                if (passInput.type === 'password') {
                    passInput.type = 'text';
                    if (icon) icon.textContent = 'visibility_off';
                } else {
                    passInput.type = 'password';
                    if (icon) icon.textContent = 'visibility';
                }
            });
        }

        function showAlert(message, type = 'error') {
            const alertBox = document.getElementById('auth-alert');
            alertBox.className = type === 'error'
                ? 'mb-4 p-3 rounded-lg text-xs leading-relaxed bg-red-50 text-red-700 border border-red-200 block'
                : 'mb-4 p-3 rounded-lg text-xs leading-relaxed bg-emerald-50 text-emerald-800 border border-emerald-200 block';
            alertBox.textContent = message;
        }

        function hideAlert() {
            const alertBox = document.getElementById('auth-alert');
            alertBox.className = 'hidden';
        }

        // Google OAuth Sign In
        document.getElementById('google-login-btn').addEventListener('click', async () => {
            hideAlert();
            if (!window.FlowAuth.isConfigured()) {
                showAlert('Supabase is not configured yet. Click "Configure" at top right to enter your Supabase Project credentials.', 'error');
                FlowSupabaseUI.openConfigModal();
                return;
            }
            try {
                await window.FlowAuth.signInWithGoogle();
            } catch (err) {
                showAlert('Google Sign-In failed: ' + (err.message || 'Please check your Supabase Google OAuth provider settings.'));
            }
        });

        // Email / Password Form Submit
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAlert();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('login-submit-btn');
            const btnText = document.getElementById('login-btn-text');
            const btnSpinner = document.getElementById('login-btn-spinner');

            if (!email || !password) {
                showAlert('Please enter both your email address and password.');
                return;
            }

            submitBtn.disabled = true;
            btnText.textContent = 'Signing in...';
            btnSpinner.classList.remove('hidden');

            try {
                // If Supabase is configured, use Supabase Auth
                if (window.FlowAuth.isConfigured()) {
                    const result = await window.FlowAuth.signInWithEmail(email, password);
                    if (result?.user) {
                        FlowSupabaseUI.showToast('Login successful! Redirecting...', 'success');
                        setTimeout(() => {
                            window.location.href = 'home.html';
                        }, 500);
                        return;
                    }
                } else {
                    // Fallback to Express Local Auth or Prompt Configuration
                    const response = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });
                    const data = await response.json();
                    if (response.ok) {
                        localStorage.setItem('user', JSON.stringify(data.user));
                        FlowSupabaseUI.showToast('Login successful! Redirecting...', 'success');
                        setTimeout(() => {
                            window.location.href = 'home.html';
                        }, 500);
                        return;
                    } else {
                        showAlert('Error: ' + (data.error || 'Invalid credentials. You can also configure Supabase above.'));
                    }
                }
            } catch (err) {
                console.error(err);
                const msg = err.message || 'Failed to sign in.';
                if (msg.includes('Invalid login credentials')) {
                    showAlert('Invalid email or password. Please verify your credentials or register a new account.');
                } else if (msg.includes('Email not confirmed')) {
                    showAlert('Please confirm your email address via the verification link sent by Supabase.');
                } else {
                    showAlert(msg);
                }
            } finally {
                submitBtn.disabled = false;
                btnText.textContent = 'Sign In';
                btnSpinner.classList.add('hidden');
            }
        });
    </script>
</body>

</html>
