<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Ola_Note - Board</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#a04100",
                        "primary-container": "#ff6b00",
                        "on-primary-container": "#572000",
                        "surface": "#fbf9f9",
                        "on-surface": "#1b1c1c",
                        "surface-container-lowest": "#ffffff",
                        "surface-variant": "#e3e2e2",
                        "on-surface-variant": "#5a4136",
                        "outline": "#8e7164",
                        "outline-variant": "#e2bfb0",
                        "error": "#ba1a1a",
                        "on-error": "#ffffff"
                    },
                    "fontFamily": { "inter": ["Inter", "sans-serif"] }
                }
            }
        }
    </script>
    <style>
        .milanote-grid {
            background-image: linear-gradient(to right, #e5e7eb 1px, transparent 1px),
                              linear-gradient(to bottom, #e5e7eb 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .card-shadow { box-shadow: 0px 2px 4px rgba(0, 0, 0, 0.05); }
        .kanban-column { min-height: 200px; }
        .task-card.sortable-ghost { opacity: 0.4; }
        .task-card.sortable-drag { cursor: grabbing !important; }
        .modal { display: none; }
        .modal.active { display: flex; }
    </style>
</head>
<body class="bg-surface font-inter text-on-surface min-h-screen pb-24">
    <!-- TopAppBar -->
    <header class="w-full top-0 sticky bg-surface/80 backdrop-blur-md z-40 border-b border-outline-variant">
        <div class="flex items-center justify-between px-4 h-16 w-full max-w-7xl mx-auto">
            <h1 class="font-bold text-2xl text-primary flex items-center gap-2">
                <span class="material-symbols-outlined">edit_square</span> Ola_Note
            </h1>
            <div class="flex items-center gap-4">
                <span id="user-greeting" class="text-sm font-semibold text-on-surface-variant hidden md:block"></span>
                <button onclick="logout()" class="text-sm font-semibold text-primary hover:underline">Log Out</button>
            </div>
        </div>
    </header>

    <!-- Board Canvas -->
    <main class="milanote-grid min-h-[calc(100vh-64px)] px-4 py-8 relative">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 max-w-7xl mx-auto items-start">
            
            <!-- To Do Column -->
            <div class="bg-surface-variant/30 rounded-xl p-4 flex flex-col gap-4">
                <div class="flex items-center justify-between">
                    <h3 class="font-semibold text-lg flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-error"></span> To Do
                    </h3>
                    <span id="count-todo" class="bg-surface-variant text-xs px-2 py-1 rounded-full font-bold">0</span>
                </div>
                <div id="col-todo" data-status="todo" class="kanban-column flex flex-col gap-3">
                    <!-- Tasks injected here -->
                </div>
            </div>

            <!-- In Progress Column -->
            <div class="bg-surface-variant/30 rounded-xl p-4 flex flex-col gap-4">
                <div class="flex items-center justify-between">
                    <h3 class="font-semibold text-lg flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-primary-container"></span> In Progress
                    </h3>
                    <span id="count-in_progress" class="bg-surface-variant text-xs px-2 py-1 rounded-full font-bold">0</span>
                </div>
                <div id="col-in_progress" data-status="in_progress" class="kanban-column flex flex-col gap-3">
                </div>
            </div>

            <!-- Done Column -->
            <div class="bg-surface-variant/30 rounded-xl p-4 flex flex-col gap-4">
                <div class="flex items-center justify-between">
                    <h3 class="font-semibold text-lg flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-green-500"></span> Done
                    </h3>
                    <span id="count-done" class="bg-surface-variant text-xs px-2 py-1 rounded-full font-bold">0</span>
                </div>
                <div id="col-done" data-status="done" class="kanban-column flex flex-col gap-3">
                </div>
            </div>

        </div>
    </main>

    <!-- Floating Action Button (FAB) -->
    <button onclick="openModal()" class="fixed bottom-20 right-6 w-14 h-14 bg-primary text-on-primary rounded-full shadow-lg flex items-center justify-center hover:scale-105 active:scale-95 transition-transform z-50">
        <span class="material-symbols-outlined font-bold text-2xl">add</span>
    </button>

    <!-- Add/Edit Task Modal -->
    <div id="task-modal" class="modal fixed inset-0 bg-on-surface/50 backdrop-blur-sm z-50 items-center justify-center p-4">
        <div class="bg-surface-container-lowest rounded-xl p-6 w-full max-w-md card-shadow border border-outline-variant relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-on-surface-variant hover:text-primary">
                <span class="material-symbols-outlined">close</span>
            </button>
            <h2 id="modal-title" class="text-2xl font-bold mb-4">Add New Task</h2>
            <form id="task-form" class="flex flex-col gap-4">
                <input type="hidden" id="task-id">
                <div>
                    <label class="block text-xs font-bold text-on-surface-variant uppercase mb-1">Title</label>
                    <input type="text" id="task-title" required class="w-full border border-outline-variant rounded-lg px-3 py-2 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors">
                </div>
                <div>
                    <label class="block text-xs font-bold text-on-surface-variant uppercase mb-1">Description</label>
                    <textarea id="task-desc" rows="3" class="w-full border border-outline-variant rounded-lg px-3 py-2 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-on-surface-variant uppercase mb-1">Category / Tag</label>
                        <input type="text" id="task-category" placeholder="e.g. Work, Design" class="w-full border border-outline-variant rounded-lg px-3 py-2 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-on-surface-variant uppercase mb-1">Due Date</label>
                        <input type="date" id="task-date" class="w-full border border-outline-variant rounded-lg px-3 py-2 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors">
                    </div>
                </div>
                <div class="flex justify-end gap-3 mt-4">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg font-semibold text-on-surface-variant hover:bg-surface-variant transition-colors">Cancel</button>
                    <button type="submit" class="px-4 py-2 rounded-lg font-semibold bg-primary text-on-primary hover:opacity-90 transition-opacity shadow-sm">Save Task</button>
                </div>
            </form>
        </div>
    </div>

    <!-- BottomNavBar (Optional, kept for consistency) -->
    <nav class="fixed bottom-0 left-0 w-full z-40 flex justify-around items-center px-4 py-2 bg-surface border-t border-outline-variant shadow-sm">
        <a class="flex flex-col items-center justify-center text-primary" href="home.html">
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">dashboard</span>
            <span class="text-[10px] font-bold uppercase mt-1">Board</span>
        </a>
        <a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors" href="calendar.html">
            <span class="material-symbols-outlined">calendar_month</span>
            <span class="text-[10px] font-bold uppercase mt-1">Calendar</span>
        </a>
    </nav>

    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user) {
            window.location.href = 'login.html';
        } else {
            document.getElementById('user-greeting').textContent = 'Hello, ' + user.name;
        }

        let tasks = [];

        async function fetchTasks() {
            try {
                const res = await fetch('/api/tasks?userId=' + user.id);
                tasks = await res.json();
                renderTasks();
            } catch (err) {
                console.error(err);
            }
        }

        function getCategoryColor(category) {
            if (!category) return 'bg-surface-variant text-on-surface-variant';
            const cat = category.toLowerCase();
            if (cat.includes('work') || cat.includes('design')) return 'bg-blue-100 text-blue-800';
            if (cat.includes('urgent')) return 'bg-red-100 text-red-800';
            if (cat.includes('personal')) return 'bg-green-100 text-green-800';
            return 'bg-purple-100 text-purple-800';
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const options = { month: 'short', day: 'numeric' };
            return new Date(dateStr).toLocaleDateString(undefined, options);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function renderTasks() {
            const cols = {
                todo: document.getElementById('col-todo'),
                in_progress: document.getElementById('col-in_progress'),
                done: document.getElementById('col-done')
            };

            Object.values(cols).forEach(col => col.innerHTML = '');
            const counts = { todo: 0, in_progress: 0, done: 0 };

            tasks.forEach(task => {
                const col = cols[task.status] || cols.todo;
                counts[task.status] = (counts[task.status] || 0) + 1;
                
                const card = document.createElement('div');
                card.className = "task-card bg-surface-container-lowest p-4 rounded-xl card-shadow border border-outline-variant cursor-grab active:cursor-grabbing hover:border-primary transition-colors flex flex-col gap-2";
                card.dataset.id = task.id;

                let tagHtml = '';
                if (task.category || task.due_date) {
                    tagHtml = '<div class="flex items-center gap-2 mb-1 flex-wrap">';
                    if (task.category) {
                        tagHtml += '<span class="text-[10px] font-bold px-2 py-0.5 rounded uppercase ' + getCategoryColor(task.category) + '">' + escapeHtml(task.category) + '</span>';
                    }
                    if (task.due_date) {
                        const isOverdue = new Date(task.due_date) < new Date() && task.status !== 'done';
                        tagHtml += '<span class="text-[10px] font-bold px-2 py-0.5 rounded uppercase flex items-center gap-1 ' + (isOverdue ? 'bg-red-100 text-red-800' : 'bg-surface-variant text-on-surface-variant') + '">';
                        tagHtml += '<span class="material-symbols-outlined text-[12px]">schedule</span> ' + escapeHtml(formatDate(task.due_date)) + '</span>';
                    }
                    tagHtml += '</div>';
                }

                card.innerHTML = tagHtml + 
                    '<div class="flex justify-between items-start gap-2">' +
                        '<h4 class="font-bold text-sm leading-tight">' + escapeHtml(task.title) + '</h4>' +
                        '<div class="flex gap-1 shrink-0">' +
                            '<button onclick="editTask(' + task.id + ')" class="text-on-surface-variant hover:text-primary transition-colors">' +
                                '<span class="material-symbols-outlined text-[18px]">edit</span>' +
                            '</button>' +
                            '<button onclick="deleteTask(' + task.id + ')" class="text-on-surface-variant hover:text-error transition-colors">' +
                                '<span class="material-symbols-outlined text-[18px]">delete</span>' +
                            '</button>' +
                        '</div>' +
                    '</div>' +
                    (task.description ? '<p class="text-xs text-on-surface-variant line-clamp-2">' + escapeHtml(task.description) + '</p>' : '');
                col.appendChild(card);
            });

            Object.keys(counts).forEach(status => {
                const el = document.getElementById('count-' + status);
                if (el) el.textContent = counts[status];
            });
        }

        function initSortable() {
            const columns = document.querySelectorAll('.kanban-column');
            columns.forEach(col => {
                new Sortable(col, {
                    group: 'shared',
                    animation: 150,
                    ghostClass: 'sortable-ghost',
                    dragClass: 'sortable-drag',
                    onEnd: async function (evt) {
                        const itemEl = evt.item;
                        const toStatus = evt.to.dataset.status;
                        const taskId = itemEl.dataset.id;
                        
                        const taskIndex = tasks.findIndex(t => t.id == taskId);
                        if(taskIndex > -1) {
                            if(tasks[taskIndex].status === toStatus) return;
                            
                            tasks[taskIndex].status = toStatus;
                            renderTasks();
                            
                            try {
                                await fetch('/api/tasks/' + taskId, {
                                    method: 'PUT',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ status: toStatus, userId: user.id })
                                });
                            } catch(err) {
                                console.error('Failed to update status', err);
                            }
                        }
                    },
                });
            });
        }

        const modal = document.getElementById('task-modal');
        const form = document.getElementById('task-form');

        function openModal() {
            form.reset();
            document.getElementById('task-id').value = '';
            document.getElementById('modal-title').textContent = 'Add New Task';
            modal.classList.add('active');
        }

        function closeModal() {
            modal.classList.remove('active');
        }

        function editTask(id) {
            const task = tasks.find(t => t.id === id);
            if (!task) return;
            document.getElementById('task-id').value = task.id;
            document.getElementById('task-title').value = task.title;
            document.getElementById('task-desc').value = task.description || '';
            document.getElementById('task-category').value = task.category || '';
            document.getElementById('task-date').value = task.due_date || '';
            document.getElementById('modal-title').textContent = 'Edit Task';
            modal.classList.add('active');
        }

        async function deleteTask(id) {
            if(!confirm('Are you sure you want to delete this task?')) return;
            try {
                await fetch('/api/tasks/' + id + '?userId=' + user.id, { method: 'DELETE' });
                tasks = tasks.filter(t => t.id !== id);
                renderTasks();
            } catch(err) {
                console.error(err);
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('task-id').value;
            const payload = {
                userId: user.id,
                title: document.getElementById('task-title').value,
                description: document.getElementById('task-desc').value,
                category: document.getElementById('task-category').value,
                due_date: document.getElementById('task-date').value
            };

            try {
                if (id) {
                    await fetch('/api/tasks/' + id, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                } else {
                    await fetch('/api/tasks', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                }
                closeModal();
                fetchTasks();
            } catch (err) {
                console.error(err);
            }
        });

        function logout() {
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        }

        if (user) {
            fetchTasks().then(initSortable);
        }
    </script>
</body>
</html>
