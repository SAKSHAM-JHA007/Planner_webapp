<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Milanote - Start Planning</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet">
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #fbf9f9;
        }

        .canvas-grid {
            background-image: radial-gradient(#e2bfb0 0.5px, transparent 0.5px);
            background-size: 24px 24px;
        }

        .floating-input:focus-within label {
            transform: translateY(-20px) scale(0.85);
            color: #a04100;
        }

        .input-underline {
            transition: width 0.3s ease;
        }

        .floating-input:focus-within .input-underline {
            width: 100%;
        }
    </style>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed": "#d0e4ff",
                        "error-container": "#ffdad6",
                        "on-surface-variant": "#5a4136",
                        "inverse-surface": "#303031",
                        "on-primary-container": "#572000",
                        "outline-variant": "#e2bfb0",
                        "surface": "#fbf9f9",
                        "on-error": "#ffffff",
                        "on-primary": "#ffffff",
                        "on-secondary-container": "#656464",
                        "on-primary-fixed": "#351000",
                        "primary-fixed-dim": "#ffb693",
                        "secondary-container": "#e5e2e1",
                        "error": "#ba1a1a",
                        "on-background": "#1b1c1c",
                        "surface-bright": "#fbf9f9",
                        "on-tertiary-fixed": "#001d35",
                        "tertiary-container": "#059eff",
                        "outline": "#8e7164",
                        "on-tertiary-fixed-variant": "#00497b",
                        "tertiary-fixed-dim": "#9ccaff",
                        "inverse-primary": "#ffb693",
                        "surface-variant": "#e3e2e2",
                        "surface-container-low": "#f5f3f3",
                        "on-tertiary-container": "#003357",
                        "on-secondary": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "surface-container": "#efeded",
                        "on-secondary-fixed": "#1c1b1b",
                        "primary": "#a04100",
                        "secondary": "#5f5e5e",
                        "primary-fixed": "#ffdbcc",
                        "tertiary": "#0062a1",
                        "surface-container-high": "#e9e8e7",
                        "on-secondary-fixed-variant": "#474646",
                        "on-error-container": "#93000a",
                        "on-primary-fixed-variant": "#7a3000",
                        "primary-container": "#ff6b00",
                        "surface-dim": "#dbdad9",
                        "secondary-fixed": "#e5e2e1",
                        "inverse-on-surface": "#f2f0f0",
                        "surface-tint": "#a04100",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-highest": "#e3e2e2",
                        "secondary-fixed-dim": "#c8c6c5",
                        "on-surface": "#1b1c1c",
                        "background": "#fbf9f9"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "grid-margin": "16px",
                        "sm": "12px",
                        "md": "16px",
                        "lg": "24px",
                        "grid-gutter": "12px",
                        "xs": "8px",
                        "base": "4px",
                        "xl": "32px"
                    },
                    "fontFamily": {
                        "display-lg": ["Inter"],
                        "display-lg-mobile": ["Inter"],
                        "body-sm": ["Inter"],
                        "headline-md": ["Inter"],
                        "label-caps": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "display-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                },
            },
        }
    </script>
</head>

<body
    class="bg-background text-on-surface min-h-screen flex flex-col items-center justify-center canvas-grid overflow-x-hidden">
    <!-- Top Navigation Anchor (Suppressed in transactional, but keeping logo for identity) -->
    <header class="fixed top-0 left-0 w-full flex items-center justify-center h-16 px-grid-margin bg-transparent z-40">
        <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-primary" style="font-size: 28px;">edit_square</span>
            <h1 class="font-display-lg-mobile text-display-lg-mobile text-primary tracking-tight">Ola_Note</h1>
        </div>
    </header>
    <!-- Main Signup Canvas -->
    <main class="w-full max-w-md px-grid-margin py-xl z-10">
        <!-- Brand Intro Section -->
        <div class="text-center mb-xl">
            <h2 class="font-display-lg text-display-lg text-on-background mb-xs">Start Planning</h2>
            <p class="font-body-lg text-body-lg text-secondary">Organize your creative projects in one visual workspace.
            </p>
        </div>
        <!-- Signup Card -->
        <div class="bg-surface-container-lowest border border-outline-variant/30 rounded-xl p-lg shadow-sm">
            <form id="signup-form" class="space-y-lg">
                <!-- Name Field -->
                <div class="relative floating-input group">
                    <input
                        class="block w-full pt-6 pb-1 bg-transparent border-0 border-b border-outline focus:ring-0 peer font-body-lg text-on-surface"
                        id="name" placeholder=" " type="text">
                    <label
                        class="absolute left-0 top-4 text-on-surface-variant font-body-lg transition-all duration-200 pointer-events-none peer-focus:text-primary peer-placeholder-shown:translate-y-0 peer-focus:-translate-y-5 peer-focus:scale-90"
                        for="name">Full Name</label>
                    <div
                        class="input-underline absolute bottom-0 left-1/2 -translate-x-1/2 w-0 h-[2px] bg-primary group-focus-within:w-full transition-all duration-300">
                    </div>
                </div>
                <!-- Email Field -->
                <div class="relative floating-input group">
                    <input
                        class="block w-full pt-6 pb-1 bg-transparent border-0 border-b border-outline focus:ring-0 peer font-body-lg text-on-surface"
                        id="email" placeholder=" " type="email">
                    <label
                        class="absolute left-0 top-4 text-on-surface-variant font-body-lg transition-all duration-200 pointer-events-none peer-focus:text-primary peer-placeholder-shown:translate-y-0 peer-focus:-translate-y-5 peer-focus:scale-90"
                        for="email">Email Address</label>
                    <div
                        class="input-underline absolute bottom-0 left-1/2 -translate-x-1/2 w-0 h-[2px] bg-primary group-focus-within:w-full transition-all duration-300">
                    </div>
                </div>
                <!-- Password Field -->
                <div class="relative floating-input group">
                    <input
                        class="block w-full pt-6 pb-1 bg-transparent border-0 border-b border-outline focus:ring-0 peer font-body-lg text-on-surface"
                        id="password" placeholder=" " type="password">
                    <label
                        class="absolute left-0 top-4 text-on-surface-variant font-body-lg transition-all duration-200 pointer-events-none peer-focus:text-primary peer-placeholder-shown:translate-y-0 peer-focus:-translate-y-5 peer-focus:scale-90"
                        for="password">Password</label>
                    <div
                        class="input-underline absolute bottom-0 left-1/2 -translate-x-1/2 w-0 h-[2px] bg-primary group-focus-within:w-full transition-all duration-300">
                    </div>
                </div>
                <!-- Primary Action -->
                <button
                    class="w-full bg-primary-container text-on-primary-container font-headline-md text-headline-md py-md rounded-lg shadow-sm hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2"
                    type="submit">
                    <span class="">Create Account</span>
                    <span class="material-symbols-outlined" style="font-size: 20px;">arrow_forward</span>
                </button>
            </form>
            <div class="flex items-center my-lg">
                <div class="flex-grow h-px bg-outline-variant/50"></div>
                <span class="px-md font-label-caps text-label-caps text-secondary uppercase">Or continue with</span>
                <div class="flex-grow h-px bg-outline-variant/50"></div>
            </div>
            <!-- Social Signups -->
            <div class="grid grid-cols-2 gap-md">
                <button
                    class="flex items-center justify-center gap-2 py-sm border border-secondary text-secondary rounded-lg font-body-lg hover:bg-secondary-container transition-colors active:scale-95">
                    <svg class="w-5 h-5" viewBox="0 0 24 24">
                        <path
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                            fill="currentColor"></path>
                        <path
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                            fill="currentColor"></path>
                        <path
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"
                            fill="currentColor"></path>
                        <path
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 12-4.53z"
                            fill="currentColor"></path>
                    </svg>
                    <span class="">Google</span>
                </button>
                <button
                    class="flex items-center justify-center gap-2 py-sm bg-on-background text-surface rounded-lg font-body-lg hover:opacity-90 transition-colors active:scale-95">
                    <svg class="w-5 h-5" viewBox="0 0 24 24">
                        <path
                            d="M17.05 20.28c-.96.95-2.06 1.83-3.4 1.83-1.28 0-1.7-.8-3.2-.8-1.5 0-1.98.78-3.2.78-1.34 0-2.48-.95-3.41-1.85-2-1.97-3.53-5.58-3.53-8.8 0-3.18 1.64-4.88 3.2-4.88 1.15 0 1.95.63 2.8.63.84 0 1.55-.65 2.88-.65 1.48 0 2.65.7 3.43 1.84-3.13 1.67-2.62 6.08.53 7.37-.62 1.5-1.4 3.03-2.1 4.53zM12.03 5.48c-.03-2.44 2.05-4.5 4.38-4.48.33 2.84-2.8 5.15-4.38 4.48z"
                            fill="currentColor"></path>
                    </svg>
                    <span class="">Apple</span>
                </button>
            </div>
        </div>
        <!-- Footer Link -->
        <p class="mt-lg text-center font-body-sm text-body-sm text-on-surface-variant">
            Already have an account?
            <a class="text-primary font-bold hover:underline" href="login.html">Log in</a>
        </p>
    </main>
    <!-- Side Graphic (Decorative Bento Element for Desktop) -->
    <div class="hidden lg:block fixed right-0 top-0 bottom-0 w-1/3 bg-surface-container-high overflow-hidden">
        <div class="absolute inset-0 p-lg grid grid-cols-2 grid-rows-3 gap-md">
            <div class="bg-surface rounded-xl shadow-sm p-md transform rotate-3 flex flex-col justify-between">
                <span class="material-symbols-outlined text-primary">image</span>
                <div class="h-2 w-1/2 bg-outline-variant rounded"></div>
            </div>
            <div class="bg-surface rounded-xl shadow-sm p-md transform -rotate-2 flex flex-col gap-xs">
                <div class="h-4 w-3/4 bg-primary-fixed rounded"></div>
                <div class="h-2 w-full bg-surface-variant rounded"></div>
                <div class="h-2 w-full bg-surface-variant rounded"></div>
            </div>
            <div class="col-span-2 bg-surface rounded-xl shadow-sm overflow-hidden relative">
                <div class="absolute inset-0 bg-cover bg-center"
                    data-alt="A clean, minimalist architectural photograph of a modern workspace with soft natural lighting coming from a large window. The space features a sleek wooden desk and a designer chair against a light grey wall. The overall aesthetic is professional, airy, and focused on creative productivity."
                    style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuB7yN6Ap8zEtcOxxrD5eVPg1LezcvXXr1qDCsBEdv_8z2DFpxzf02dJvoEjQu_qqzHC0o9Pm7PksOqlLAXkvaNj-f0ss_UfH8PXHdSgA94UYPyJOQaLmxP1c9vKRdLTrgf8PXnXPGKFu630uUAhsXgkWkJ3tmtB29QNOsWj2GUDXnBgVNHZvKWTAq0Qji7BPpX3ThYEVq_tyo0UknkbKe3kAD7SOhxmz5tbwjBoVhp8lpNkkMWwKjKV09yCSVvaNRFhtaVZyFt8QKY')">
                </div>
            </div>
            <div class="bg-surface rounded-xl shadow-sm p-md transform rotate-6 flex flex-col gap-xs">
                <div class="flex items-center gap-2">
                    <div class="w-4 h-4 rounded-full bg-tertiary"></div>
                    <div class="h-2 w-12 bg-outline-variant rounded"></div>
                </div>
            </div>
            <div class="bg-primary-container rounded-xl shadow-md p-md transform -rotate-12 flex flex-col justify-end">
                <p class="text-on-primary-container font-label-caps text-label-caps">STORYBOARD</p>
            </div>
        </div>
    </div>
    <!-- Background Atmospheric Shapes -->
    <div class="fixed -bottom-32 -left-32 w-96 h-96 bg-primary/5 rounded-full blur-3xl -z-10"></div>
    <div class="fixed top-1/4 -right-16 w-64 h-64 bg-tertiary/5 rounded-full blur-3xl -z-10"></div>
    <script>
        // Micro-interaction for input fields
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length > 0) {
                    e.target.nextElementSibling.classList.add('-translate-y-5', 'scale-90', 'text-primary');
                } else {
                    e.target.nextElementSibling.classList.remove('-translate-y-5', 'scale-90', 'text-primary');
                }
            });
        });

        // Simple button active state visual
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('mousedown', () => {
                btn.style.transform = 'scale(0.97)';
            });
            btn.addEventListener('mouseup', () => {
                btn.style.transform = '';
            });
            btn.addEventListener('mouseleave', () => {
                btn.style.transform = '';
            });
        });
        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                const response = await fetch('/api/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });
                const data = await response.json();
                if (response.ok) {
                    window.location.href = 'login.html';
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (err) {
                console.error(err);
                alert('Something went wrong.');
            }
        });
    </script>


</body>

</html>
