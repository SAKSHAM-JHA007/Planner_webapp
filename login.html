    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f5f5f5;
            /* Per Style Guidance "The Base" */
        }

        .canvas-dot-pattern {
            background-image: radial-gradient(#e0e0e0 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>

<body
    class="bg-surface text-on-surface min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
    <!-- Atmospheric Background Canvas Pattern -->
    <div class="absolute inset-0 canvas-dot-pattern opacity-50 pointer-events-none"></div>
    <!-- Login Container -->
    <main class="relative z-10 w-full max-w-md px-grid-margin">
        <!-- Top Branding (Optional but professional) -->
        <div class="flex justify-center mb-xl">
            <span class="font-display-lg-mobile text-display-lg-mobile text-primary tracking-tight">Ola_Note</span>
        </div>
        <!-- Login Card -->
        <div
            class="bg-surface-container-lowest rounded-xl p-lg shadow-[0px_2px_4px_rgba(0,0,0,0.05)] border border-outline-variant">
            <header class="mb-lg">
                <h1 class="font-display-lg-mobile text-display-lg-mobile text-on-background mb-base">Welcome Back</h1>
                <p class="font-body-sm text-body-sm text-secondary">Sign in to continue your creative workflow.</p>
            </header>
            <form id="login-form" class="space-y-lg">
                <!-- Email Field -->
                <div class="group">
                    <label class="font-label-caps text-label-caps text-on-surface-variant mb-base block"
                        for="email">Email</label>
                    <input
                        class="w-full bg-transparent border-0 border-b border-outline focus:ring-0 focus:border-primary-container transition-colors py-xs px-0 font-body-lg text-body-lg placeholder-secondary/30"
                        id="email" name="email" placeholder="your@email.com" required="" type="email">
                </div>
                <!-- Password Field -->
                <div class="group">
                    <div class="flex justify-between items-center mb-base">
                        <label class="font-label-caps text-label-caps text-on-surface-variant block"
                            for="password">Password</label>
                        <a class="font-label-caps text-label-caps text-secondary hover:text-primary transition-colors"
                            href="#">Forgot Password?</a>
                    </div>
                    <div class="relative">
                        <input
                            class="w-full bg-transparent border-0 border-b border-outline focus:ring-0 focus:border-primary-container transition-colors py-xs px-0 font-body-lg text-body-lg placeholder-secondary/30"
                            id="password" name="password" placeholder="••••••••" required="" type="password">
                        <button
                            class="absolute right-0 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors"
                            type="button">
                            <span class="material-symbols-outlined text-[20px]">visibility</span>
                        </button>
                    </div>
                </div>
                <!-- Login Button -->
                <button
                    class="w-full bg-primary-container text-on-primary font-headline-md text-headline-md py-md rounded-lg shadow-sm hover:opacity-90 active:scale-[0.98] transition-all duration-200 mt-xl"
                    type="submit">
                    Log In
                </button>
            </form>
            <!-- Social Login Divider -->
            <div class="relative my-xl flex items-center">
                <div class="flex-grow border-t border-outline-variant"></div>
                <span
                    class="px-md font-label-caps text-label-caps text-on-secondary-fixed-variant bg-surface-container-lowest">OR</span>
                <div class="flex-grow border-t border-outline-variant"></div>
            </div>
            <!-- Social Logins -->
            <div class="grid grid-cols-2 gap-md">
                <button
                    class="flex items-center justify-center gap-xs border border-outline rounded-lg py-sm font-label-caps text-label-caps text-on-surface hover:bg-surface-variant transition-colors">
                    <img class="w-4 h-4"
                        data-alt="A clean, minimalist 2D vector icon of the Google 'G' logo on a white circular background. The style is sharp and corporate, fitting for a modern professional login interface."
                        src="https://lh3.googleusercontent.com/aida-public/AB6AXuBG3L7ZMSS8tKvMeH8xCSFJdqnzf6GnK_2RZvv6AWM118Wm3q8VbPEII0-JIHsHujbap-pHs43OeNqbCIkR37TyuSAQUNvTkIAVSoduqrvRVjxa9nY92h2AEhFgzWCe9K04AqH4_OALnxVJKYQOipwM64eaHuxTQwRZPKa5rkVdrGibS8fkOjno7hvnT-DkbPjLx6sSkTQYR9QXQVUsXjK1VuW_kccAnMOVGXjvs81jNh_XthZ0wXI5JdDvd4yv6fxNHBARSvAyJIA">
                    Google
                </button>
                <button
                    class="flex items-center justify-center gap-xs border border-outline rounded-lg py-sm font-label-caps text-label-caps text-on-surface hover:bg-surface-variant transition-colors">
                    <span class="material-symbols-outlined text-[18px]">file_download</span>
                    Apple
                </button>
            </div>
        </div>
        <!-- Footer Link -->
        <div class="mt-lg text-center">
            <p class="font-body-sm text-body-sm text-on-surface-variant">
                Don't have an account?
                <a class="text-primary font-semibold hover:underline transition-all" href="signup.html">Sign up</a>
            </p>
        </div>
    </main>
    <!-- Side Graphic for Visual Interest (Subtle Board Layout) -->
    <div
        class="hidden lg:block absolute right-[-5%] top-1/2 -translate-y-1/2 w-[400px] h-[600px] pointer-events-none rotate-3">
        <div
            class="bg-surface-container-highest border border-outline-variant p-md rounded-xl w-64 h-48 absolute top-0 left-0 shadow-lg flex flex-col gap-base">
            <div class="w-full h-24 bg-surface-variant rounded-lg overflow-hidden">
                <img class="w-full h-full object-cover opacity-60"
                    data-alt="A moody, high-contrast black and white architectural photograph of a spiral staircase in a minimalist concrete building. The lighting is dramatic, casting deep geometric shadows across the pristine surfaces, creating a professional and artistic atmosphere."
                    src="https://lh3.googleusercontent.com/aida-public/AB6AXuBYA_2nxoU9dlaFafRu3slg-tWKD2D_mZPuRJTn-GgdTOe7sTu4F0gVYipLFnZNQSm6eLt9_dwPD_5-sNsFdjyiw3XyObgY4u91ak_YIKo8EK_3j8sFmoTC7ccLtsAe426azDja5WzuCMVzKXafg6fXd03TwiAuHgE5TbtpMUtI4B-JZS0fT0Aa_mtLsH3cBLwYq43P_Ar9u1G9Eq5P0wEzUVzaU1FK8TKHu_oAYzxyyBtAwqfK9yStZfez2_Uyd_G3Ni1nfIyhffE">
            </div>
            <div class="h-2 w-3/4 bg-primary-container/20 rounded-full"></div>
            <div class="h-2 w-1/2 bg-on-surface-variant/20 rounded-full"></div>
        </div>
        <div
            class="bg-surface-container-highest border border-outline-variant p-md rounded-xl w-56 h-40 absolute bottom-12 right-12 shadow-md -rotate-6 flex flex-col gap-base">
            <div class="flex gap-xs mb-xs">
                <div class="w-2 h-2 rounded-full bg-error"></div>
                <div class="w-2 h-2 rounded-full bg-primary"></div>
                <div class="w-2 h-2 rounded-full bg-tertiary"></div>
            </div>
            <div class="h-2 w-full bg-on-surface-variant/10 rounded-full"></div>
            <div class="h-2 w-5/6 bg-on-surface-variant/10 rounded-full"></div>
            <div class="h-2 w-2/3 bg-on-surface-variant/10 rounded-full"></div>
        </div>
    </div>
    <!-- Small Floating Accessory -->
    <div class="fixed bottom-lg left-lg hidden md:block">
        <div
            class="bg-inverse-surface text-inverse-on-surface px-md py-sm rounded-full flex items-center gap-xs shadow-xl scale-90">
            <span class="material-symbols-outlined text-[18px]">info</span>
            <span class="font-label-caps text-label-caps">Privacy secured with 256-bit encryption</span>
        </div>
    </div>
    <script>
        // Redirect if already logged in
        const existingUser = JSON.parse(localStorage.getItem('user'));
        if (existingUser && existingUser.id) {
            window.location.href = 'home.html';
        }

        // Micro-interaction for input highlighting
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                const label = input.closest('.group')?.querySelector('label');
                if (label) label.classList.replace('text-on-surface-variant', 'text-primary');
            });
            input.addEventListener('blur', () => {
                const label = input.closest('.group')?.querySelector('label');
                if (label) label.classList.replace('text-primary', 'text-on-surface-variant');
            });
        });

        // Toggle password visibility
        const togglePass = document.querySelector('button span.material-symbols-outlined');
        if (togglePass) {
            togglePass.parentElement.addEventListener('click', function () {
                const passInput = document.getElementById('password');
                const icon = this.querySelector('.material-symbols-outlined');
                if (passInput.type === 'password') {
                    passInput.type = 'text';
                    if (icon) icon.textContent = 'visibility_off';
                } else {
                    passInput.type = 'password';
                    if (icon) icon.textContent = 'visibility';
                }
            });
        }
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();
                if (response.ok) {
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = 'home.html';
                } else {
                    alert('Error: ' + (data.error || 'Failed to log in.'));
                }
            } catch (err) {
                console.error(err);
                alert('Something went wrong.');
            }
        });
    </script>


</body>

</html>
